# GitHub Pages deployment for one iLogia frontend. Generated by scripts/export-app.mjs.
# Required repository VARIABLES (Settings → Secrets and variables → Actions → Variables) — public values only:
#   VITE_SUPABASE_URL, VITE_SUPABASE_PUBLISHABLE_KEY, VITE_COOKIE_DOMAIN (.ilogia-eg.com), VITE_API_BASE
# Never add a service-role key here: the browser build refuses to start if one is provided.
name: Deploy to GitHub Pages
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_COOKIE_DOMAIN: ${{ vars.VITE_COOKIE_DOMAIN }}
          VITE_API_BASE: ${{ vars.VITE_API_BASE }}
      - name: Guard against leaked secrets in the bundle
        # Matches real key material only (sb_secret_… keys or JWTs whose payload holds role=service_role).
        run: "! grep -rEl 'sb_secret_[A-Za-z0-9_-]{20,}|c2VydmljZV9yb2xl|InNlcnZpY2Vfcm9sZS' apps/app---ilogia/dist"
      - uses: actions/upload-pages-artifact@v3
        with: { path: apps/app---ilogia/dist }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
